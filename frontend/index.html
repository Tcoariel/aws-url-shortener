
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acortador de enlaces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Acortador de enlaces</h1>
        <p>Convierte tus enlaces largos en enlaces cortos.</p>

        <form id="urlForm">
            <input
                type="url"
                id="originalUrl"
                placeholder="Ingresa tu URL"
                required
            >

            <button type="submit">Acortar enlace</button>
        </form>

        <div id="result" hidden>
            <p>Tu enlace corto:</p>
            <a id="shortUrl" target="_blank"></a>
            <button type="button" id="copyButton">Copiar enlace</button>
        </div>

        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
